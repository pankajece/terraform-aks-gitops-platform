name: Terraform deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        options: [dev, test]
      apply:
        description: Apply the generated plan after review/approval
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Plan and deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: terraform-${{ inputs.environment }}
    defaults:
      run:
        working-directory: terraform
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
    steps:
      - uses: actions/checkout@v4
      - name: Check client Id 
        run: 
          echo "${{ vars.AZURE_CLIENT_ID }}"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Initialize remote backend
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP"
          -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT"
          -backend-config="container_name=$TF_STATE_CONTAINER"
          -backend-config="key=aks/${{ inputs.environment }}.tfstate"
          -backend-config="use_azuread_auth=true"
      - name: Validate
        run: terraform validate -no-color
      - name: Plan
        run: terraform plan -input=false -no-color -var-file="environments/${{ inputs.environment }}/${{ inputs.environment }}.tfvars" -out=tfplan
      - name: Apply reviewed plan
        if: ${{ inputs.apply }}
        run: terraform apply -input=false -no-color tfplan
